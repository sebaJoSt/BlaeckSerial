name: Compile Examples

on:
  push:
    paths:
      - ".github/workflows/compile-examples.yml"
      - "examples/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/compile-examples.yml"
      - "examples/**"
      - "src/**"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.board.fqbn }}
    runs-on: ubuntu-latest

    env:
      SKETCHES_REPORTS_PATH: sketches-reports

    strategy:
      fail-fast: false

      matrix:
        board:
          # --- AVR boards ---
          # Three examples are mega-only and stay off this job, each because it
          # does not fit a nano:
          #   WaveformGenerator needs about 35 kB of flash against a nano's
          #     30 kB. Everything it declares is the point of the example, so
          #     there is nothing to trim that would leave it worth reading.
          #   SineGeneratorAdvanced needs about 35 kB for the same reason.
          #   SignalMetadata compiles for a nano at 87% flash and 81% RAM, but
          #     that 81% counts neither the signal table nor the ten String
          #     names, both of which come off the same 371 bytes the report
          #     leaves for locals. Too little stack to trust.
          # EventChannels builds here since it sizes its own tables on the
          # begin() chain: four channels is above a small AVR's default, and
          # saying so is all it takes.
          - fqbn: arduino:avr:nano
            platforms: |
              - name: arduino:avr
            libraries: |
              - source-path: ./
              - name: CRC
              - name: Adafruit SHT31 Library
            sketch-paths: |
              - examples/Basic
              - examples/Commands
              - examples/DatatypeTest
              - examples/EventChannels
              - examples/SHT31TempHumiditySensor
              - examples/SineGeneratorBasic
              - examples/WriteModes
            artifact-name-suffix: arduino-avr-nano
          - fqbn: arduino:avr:mega
            platforms: |
              - name: arduino:avr
            libraries: |
              - source-path: ./
              - name: CRC
              - name: Adafruit SHT31 Library
            sketch-paths: |
              - examples/Basic
              - examples/Commands
              - examples/DatatypeTest
              - examples/EventChannels
              - examples/SHT31TempHumiditySensor
              - examples/SignalMetadata
              - examples/SineGeneratorAdvanced
              - examples/SineGeneratorBasic
              - examples/WaveformGenerator
              - examples/WriteModes
            artifact-name-suffix: arduino-avr-mega
          # --- ESP32: no RTC ---
          - fqbn: arduino:esp32:nano_nora
            platforms: |
              - name: arduino:esp32
            libraries: |
              - source-path: ./
              - name: CRC
              - name: Adafruit SHT31 Library
            sketch-paths: |
              - examples/Basic
              - examples/Commands
              - examples/DatatypeTest
              - examples/EventChannels
              - examples/SHT31TempHumiditySensor
              - examples/SignalMetadata
              - examples/SineGeneratorBasic
              - examples/WaveformGenerator
              - examples/WriteModes
            artifact-name-suffix: arduino-esp32-nano_nora
          # --- SAMD: no RTC ---
          - fqbn: arduino:samd:mkrzero
            platforms: |
              - name: arduino:samd
            libraries: |
              - source-path: ./
              - name: CRC
              - name: Adafruit SHT31 Library
            sketch-paths: |
              - examples/Basic
              - examples/Commands
              - examples/DatatypeTest
              - examples/EventChannels
              - examples/SHT31TempHumiditySensor
              - examples/SignalMetadata
              - examples/SineGeneratorBasic
              - examples/WaveformGenerator
              - examples/WriteModes
            artifact-name-suffix: arduino-samd-mkrzero
          # --- Uno R4 WiFi: has RTC in core ---
          - fqbn: arduino:renesas_uno:unor4wifi
            platforms: |
              - name: arduino:renesas_uno
            libraries: |
              - source-path: ./
              - name: CRC
              - name: Adafruit SHT31 Library
            sketch-paths: |
              - examples/Basic
              - examples/Commands
              - examples/DatatypeTest
              - examples/EventChannels
              - examples/SHT31TempHumiditySensor
              - examples/SignalMetadata
              - examples/SineGeneratorBasic
              - examples/TimeStampModes
              - examples/WaveformGenerator
              - examples/WriteModes
            artifact-name-suffix: arduino-renesas_uno-unor4wifi
          # --- ArduinoCore-mbed (Giga R1): no RTC.
          #     Covered because the buffered-writes defaults treat mbed as a
          #     special case, so this family must not regress unnoticed. ---
          - fqbn: arduino:mbed_giga:giga
            platforms: |
              - name: arduino:mbed_giga
            libraries: |
              - source-path: ./
              - name: CRC
              - name: Adafruit SHT31 Library
            sketch-paths: |
              - examples/Basic
              - examples/Commands
              - examples/DatatypeTest
              - examples/EventChannels
              - examples/SHT31TempHumiditySensor
              - examples/SignalMetadata
              - examples/SineGeneratorBasic
              - examples/WaveformGenerator
              - examples/WriteModes
            artifact-name-suffix: arduino-mbed_giga-giga

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          libraries: ${{ matrix.board.libraries }}
          sketch-paths: ${{ matrix.board.sketch-paths }}
          enable-deltas-report: true
          sketches-report-path: ${{ env.SKETCHES_REPORTS_PATH }}

      - name: Save sketches report as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: ${{ env.SKETCHES_REPORTS_PATH }}
          name: sketches-report-${{ matrix.board.artifact-name-suffix }}
