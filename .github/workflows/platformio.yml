name: PlatformIO

# A second toolchain, and a check on distribution.
#
# The same code can be a warning on one core and an error on another: a repeated
# default argument passed on AVR and failed the SAMD and ESP32 jobs of the
# arduino-cli matrix. Building here as well is worth it because PlatformIO reports
# on AVR what arduino-cli only reports on the boards a local build usually skips.
#
# It also covers the half of distribution library.properties does not: whether
# library.json resolves, builds, and packages for a PlatformIO user.

on:
  push:
    paths:
      - ".github/workflows/platformio.yml"
      - "examples/**"
      - "src/**"
      - "library.json"
      - "library.properties"
  pull_request:
    paths:
      - ".github/workflows/platformio.yml"
      - "examples/**"
      - "src/**"
      - "library.json"
      - "library.properties"
  workflow_dispatch:

jobs:
  # A version bump publishes to the PlatformIO registry on its own - no tag, no pio
  # install, nothing manual. 7.0.0, 6.0.2 and 5.0.2 each appeared there on the day
  # their bump was committed, none tagged, and the 7.0.0 a user installs today is a
  # mid-development branch state.
  #
  # Which file carries the version matters now: library.json wins where both exist.
  # Verified - set it to 7.0.99 against a library.properties of 7.0.0 and pkg pack
  # named the tarball 7.0.99. The two are checked for agreement because Arduino reads
  # the other one, and the registries would otherwise publish different numbers.
  #
  # A bump is a release. This fails when one arrives without a tag - an alarm rather
  # than a lock, since the crawler may already have taken it, but it says so within a
  # minute instead of at the next release.
  version-bump-is-tagged:
    name: A version bump has a tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The two manifests agree
        run: |
          j=$(python -c "import json;print(json.load(open('library.json'))['version'])")
          p=$(grep '^version=' library.properties | cut -d= -f2)
          echo "library.json=$j  library.properties=$p"
          if [ "$j" != "$p" ]; then
            echo "::error::The manifests disagree. PlatformIO reads library.json and"
            echo "Arduino reads library.properties, so the two registries would publish"
            echo "different code under different numbers. Verified: pkg pack names the"
            echo "tarball from library.json when they differ."
            exit 1
          fi

      - name: A changed version has a tag
        if: github.event_name == 'push'
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous ref to compare against - skipping."; exit 0
          fi
          v=$(grep '^version=' library.properties | cut -d= -f2)
          old=$(git show "$before:library.properties" 2>/dev/null | grep '^version=' | cut -d= -f2)
          if [ "$v" = "$old" ]; then
            echo "No version change in this push."; exit 0
          fi
          echo "version: $old -> $v"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "Tag $v exists. This is a release."
          else
            echo "::error::Version bumped to $v with no matching tag."
            echo "A bump alone publishes to the PlatformIO registry, so $v is now a"
            echo "release for real users taken from whatever is on this branch, and the"
            echo "number can never be reused - not even after pio pkg unpublish. Tag it,"
            echo "or revert the bump and raise it when the release is ready."
            exit 1
          fi

  build:
    name: Examples build under PlatformIO
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # The toolchain and framework packages are the slow part, not the build.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('library.json') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Only the examples that need nothing beyond CRC. SHT31TempHumiditySensor
      # wants Adafruit SHT31 and TimeStampModes wants RTC.h - the arduino-cli
      # matrix covers those. The sketch folder is passed rather than the .ino so
      # a sketch split across several files is built whole.
      - name: Build examples
        run: |
          for ex in Basic Commands DatatypeTest EventChannels SignalMetadata \
                    SineGeneratorAdvanced SineGeneratorBasic WriteModes \
                    WaveformGenerator; do
            echo "::group::$ex"
            pio ci --board=megaatmega2560 \
                   --lib="." \
                   --project-option="lib_deps=robtillaart/CRC@^1.0.4" \
                   "examples/$ex"
            echo "::endgroup::"
          done

      # pkg pack validates the manifest's fields and builds what the registry would
      # distribute. It does NOT check that export.include names files that exist -
      # a stale entry packs silently, shipping without the file. Renaming
      # Changelog.md to CHANGELOG.md created exactly that, so it is checked here.
      - name: Check the export list
        run: |
          python - <<'PY'
          import json, os, sys
          m = json.load(open('library.json'))
          missing = [f for f in m['export']['include'] if not os.path.exists(f)]
          if missing:
              sys.exit('export.include names files that do not exist: ' + ', '.join(missing))
          print('export.include: all %d entries present' % len(m['export']['include']))
          PY

      # The output directory has to exist first. Given a path that does not,
      # pkg pack takes it for a filename and asserts it ends in .tar.gz, which
      # surfaces as "An unexpected error occurred" with a traceback.
      - name: Pack the library
        run: |
          mkdir -p /tmp/pkg
          pio pkg pack --output /tmp/pkg
          ls -l /tmp/pkg
