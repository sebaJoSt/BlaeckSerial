name: PlatformIO

# A second toolchain, for what the first one hides. arduino-cli compiles with
# -fpermissive, so gcc downgrades some errors to warnings and prints them where
# nobody looks. PlatformIO does not, and found a repeated default argument that
# six boards of the arduino-cli matrix had compiled without a word.
#
# It also checks the half of distribution that library.properties does not cover:
# whether library.json actually resolves and builds for a PlatformIO user.

on:
  push:
    paths:
      - ".github/workflows/platformio.yml"
      - "examples/**"
      - "src/**"
      - "library.json"
  pull_request:
    paths:
      - ".github/workflows/platformio.yml"
      - "examples/**"
      - "src/**"
      - "library.json"
  workflow_dispatch:

jobs:
  # Changing the version in library.properties publishes to the PlatformIO registry
  # on its own - no tag, no pio install, nothing manual. 7.0.0, 6.0.2 and 5.0.2 each
  # appeared there on the day their bump was committed, none of them tagged, and the
  # 7.0.0 that real users can install is a mid-development branch state.
  #
  # So a bump is a release. This fails when one arrives without a tag to match, which
  # is an alarm rather than a lock - the crawler may already have taken it - but it
  # says so within a minute instead of at the next release.
  version-bump-is-tagged:
    name: A version bump has a tag
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous ref to compare against - skipping."; exit 0
          fi
          if ! git diff --quiet "$before" "${{ github.sha }}" -- library.properties; then
            v=$(grep '^version=' library.properties | cut -d= -f2)
            old=$(git show "$before:library.properties" 2>/dev/null | grep '^version=' | cut -d= -f2)
            if [ "$v" != "$old" ]; then
              echo "library.properties version: $old -> $v"
              if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
                echo "Tag $v exists. This is a release."
              else
                echo "::error::Version bumped to $v with no matching tag."
                echo "PlatformIO publishes on this change alone, so $v is now a release"
                echo "for real users, taken from whatever is on this branch. Tag it, or"
                echo "revert the bump and raise it again when the release is ready."
                exit 1
              fi
            fi
          fi
          echo "No version change in this push."

  build:
    name: Examples build under PlatformIO
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The toolchain and framework packages are the slow part, not the build.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('library.json') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Only the examples that need nothing beyond CRC. SHT31TempHumiditySensor
      # wants Adafruit SHT31, SineGeneratorAdvanced wants EEPROMEx, and
      # TimeStampModes wants RTC.h - the arduino-cli matrix covers those.
      - name: Build examples
        run: |
          for ex in Basic Commands DatatypeTest EventChannels SignalMetadata \
                    SineGeneratorBasic WriteModes WaveformGenerator; do
            echo "::group::$ex"
            pio ci --board=megaatmega2560 \
                   --lib="." \
                   --project-option="lib_deps=robtillaart/CRC@^1.0.4" \
                   "examples/$ex/$ex.ino"
            echo "::endgroup::"
          done

      # pkg pack validates the manifest's fields and builds what the registry would
      # distribute. It does NOT check that export.include names files that exist -
      # a stale entry packs silently, shipping without the file. Renaming
      # Changelog.md to CHANGELOG.md created exactly that, so it is checked here.
      - name: Check the export list
        run: |
          python - <<'PY'
          import json, os, sys
          m = json.load(open('library.json'))
          missing = [f for f in m['export']['include'] if not os.path.exists(f)]
          if missing:
              sys.exit('export.include names files that do not exist: ' + ', '.join(missing))
          print('export.include: all %d entries present' % len(m['export']['include']))
          PY

      - name: Pack the library
        run: pio pkg pack --output /tmp/pkg
